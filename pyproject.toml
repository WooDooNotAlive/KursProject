[tool.poetry]
name = "bankwidget"
version = "0.1.0"
description = "Приложение для анализа банковских транзакций"
authors = ["Student <student@example.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
pandas = ">=2.0,<4.0"
openpyxl = "^3.1"
xlrd = "^2.0"
requests = "^2.32"
python-dotenv = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
flake8 = "^7.0"
mypy = "^1.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
